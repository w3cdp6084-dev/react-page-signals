name: Bug report
description: Report reproducible behavior that looks incorrect.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the behavior and what you expected instead.
    validations:
      required: true
  - type: input
    id: reproduction
    attributes:
      label: Reproduction
      description: Link to a minimal repository or sandbox when possible.
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Include react-page-signals, React, browser, and OS versions.
    validations:
      required: true
